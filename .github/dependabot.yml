# Dependabot configuration for CodeVerse Compositor
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Limit open version-update PRs to the top 7 concurrent pull requests
    # (Security updates take top priority and are managed separately by GitHub Dependabot alerts)
    open-pull-requests-limit: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions ecosystem (commented out until .github/workflows/ is added,
  # as Dependabot reports an error if the workflows directory does not exist yet)
  # - package-ecosystem: "github-actions"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 7
  #   commit-message:
  #     prefix: "chore(deps)"
  #   labels:
  #     - "dependencies"
  #     - "github-actions"
